<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemoTrack | Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f9f9f9; 
            display: flex; 
            align-items: center; 
            min-height: 100vh;
        }
        .register-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            overflow: hidden;
        }
        .btn-danger { background-color: #d32f2f; border: none; }
        .btn-danger:hover { background-color: #b71c1c; }
        .form-control:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 0 0.25rem rgba(211, 47, 47, 0.1);
        }
        .text-accent { color: #d32f2f; }
        .logo-section img { height: 50px; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card register-card p-4 p-md-5">
                
                <div class="text-center logo-section">
                    <a href="/">
                        <img src="{{ url_for('static', filename='logo2.png') }}" alt="HemoTrack Logo">
                    </a>
                    <h2 class="fw-bold">Join <span class="text-accent">HemoTrack</span></h2>
                    <p class="text-muted small">Start tracking your blood health with AI</p>
                </div>

                <form action="/register" method="POST" class="mt-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-600">Full Name</label>
                            <input type="text" name="name" class="form-control rounded-pill" placeholder="John Doe" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-600">Email Address</label>
                            <input type="email" name="email" class="form-control rounded-pill" placeholder="name@example.com" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-600">Password</label>
                            <input type="password" name="password" class="form-control rounded-pill" placeholder="••••••••" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-600">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control rounded-pill" placeholder="••••••••" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-600">Date of Birth</label>
                            <input type="date" name="dob" class="form-control rounded-pill" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-600">Biological Gender</label>
                            <select name="gender" class="form-select rounded-pill" required>
                                <option value="" selected disabled>Select...</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                            <div class="form-text mt-1" style="font-size: 0.7rem;">Needed for accurate Hb range analysis.</div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-danger btn-lg w-100 rounded-pill shadow-sm">Create Account</button>
                        </div>

                        <div class="col-12 text-center mt-3">
                            <p class="small text-muted">Already have an account? <a href="/login" class="text-accent text-decoration-none fw-bold">Login</a></p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
